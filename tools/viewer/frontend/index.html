<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #panorama-toolbar {
    margin: 6px auto 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #panorama-toolbar-buttons,
  #panorama-toolbar-status {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  #panorama-toolbar button {
    padding: 0.35rem 0.75rem;
    border: 1px solid #999;
    border-radius: 0.375rem;
    background: #f0f2f6;
    cursor: pointer;
    font-size: 0.875rem;
  }
  #panorama-source-coordinate,
  #panorama-capture-feedback {
    display: inline-block;
    font-size: 0.8rem;
    font-family: monospace;
    color: #555;
    white-space: nowrap;
    overflow: hidden;
  }
  #panorama-source-coordinate {
    width: 30ch;
  }
  #panorama-capture-feedback {
    width: 50ch;
  }
  #panorama-container {
    width: 100%;
    margin: 0 auto;
    background: #000;
    border-radius: 0.375rem;
    overflow: hidden;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="panorama-wrapper">
  <div id="panorama-container"></div>
  <div id="panorama-toolbar">
    <div id="panorama-toolbar-buttons">
      <button
        id="panorama-download-button"
        type="button"
        title="Save the current framing as a PNG image file, downloaded to your computer."
      >Download as PNG image</button>
      <button
        id="panorama-capture-button"
        type="button"
        title="Turn this framing's yaw/pitch/FoV into the flat_views.yaml snippet below."
      >Extract this view</button>
    </div>
    <div id="panorama-toolbar-status">
      <span id="panorama-source-coordinate">Hover to read source pixel</span>
      <span id="panorama-capture-feedback"></span>
    </div>
  </div>
</div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  function sendMessageToStreamlitClient(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }

  function notifyComponentReady() {
    sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
  }

  function setFrameHeight(height) {
    sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
  }

  function setComponentValue(value) {
    sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
  }

  const wrapper = document.getElementById("panorama-wrapper");
  const toolbar = document.getElementById("panorama-toolbar");
  const container = document.getElementById("panorama-container");
  const downloadButton = document.getElementById("panorama-download-button");
  const captureButton = document.getElementById("panorama-capture-button");
  const sourceCoordinateLabel = document.getElementById("panorama-source-coordinate");
  const captureFeedbackLabel = document.getElementById("panorama-capture-feedback");

  let currentArgs = null;
  let lastTextureBase64 = null;
  let isSceneInitialized = false;

  const camera = new THREE.PerspectiveCamera(80, 16 / 9, 1, 1100);
  camera.position.set(0, 0, 0.1);

  const scene = new THREE.Scene();
  const geometry = new THREE.SphereGeometry(500, 60, 40);
  geometry.scale(-1, 1, 1);
  const material = new THREE.MeshBasicMaterial();
  const sphereMesh = new THREE.Mesh(geometry, material);
  scene.add(sphereMesh);

  const raycaster = new THREE.Raycaster();
  const pointerNdc = new THREE.Vector2();
  const sphereBoundary = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 500);
  const sphereIntersectionPoint = new THREE.Vector3();

  function calculateFisheyeRadius(halfFovRadian, incidentAngleRadian) {
    switch (currentArgs.fisheye_method) {
      case "Orthographic":
        return Math.sin(incidentAngleRadian) / Math.sin(halfFovRadian);
      case "Stereographic":
        return Math.tan(incidentAngleRadian / 2) / Math.tan(halfFovRadian / 2);
      case "Equisolid":
        return Math.sin(incidentAngleRadian / 2) / Math.sin(halfFovRadian / 2);
      default:
        return incidentAngleRadian / halfFovRadian;
    }
  }

  function computeSourceCoordinate(intersectionPoint) {
    const polarAngleRadian = Math.acos(
      THREE.MathUtils.clamp(intersectionPoint.y / intersectionPoint.length(), -1, 1)
    );
    const azimuthRadian = Math.atan2(intersectionPoint.z, intersectionPoint.x);

    const normalizedU = ((azimuthRadian / (2 * Math.PI)) % 1 + 1) % 1;
    const normalizedVDisplayed = polarAngleRadian / Math.PI;

    const sourceImageWidth = currentArgs.source_image_width;
    const sourceImageHeight = currentArgs.source_image_height;

    if (currentArgs.image_kind !== "Fisheye (180°)") {
      return {
        x: Math.min(normalizedU * sourceImageWidth, sourceImageWidth - 1),
        y: Math.min(normalizedVDisplayed * sourceImageHeight, sourceImageHeight - 1),
      };
    }

    const normalizedVBeforeFlip = currentArgs.is_camera_pointing_up
      ? normalizedVDisplayed
      : 1 - normalizedVDisplayed;
    const incidentAngleRadian = normalizedVBeforeFlip * Math.PI;
    const halfFovRadian = THREE.MathUtils.degToRad(currentArgs.camera_fov_degree) / 2;
    if (incidentAngleRadian > halfFovRadian) {
      return null;
    }

    const longitudeBeforeFlip = normalizedU * 2 * Math.PI - Math.PI;
    const radius = calculateFisheyeRadius(halfFovRadian, incidentAngleRadian);
    const normalizedImageU = 0.5 + 0.5 * radius * Math.cos(longitudeBeforeFlip);
    const normalizedImageV = 0.5 + 0.5 * radius * Math.sin(longitudeBeforeFlip);
    const sourceX = normalizedImageU * (sourceImageWidth - 1);
    const sourceY = normalizedImageV * (sourceImageHeight - 1);
    if (sourceX < 0 || sourceX > sourceImageWidth - 1 || sourceY < 0 || sourceY > sourceImageHeight - 1) {
      return null;
    }
    return { x: sourceX, y: sourceY };
  }

  function updateSourceCoordinateLabel(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNdc.set(
      ((event.clientX - rect.left) / rect.width) * 2 - 1,
      -((event.clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(pointerNdc, camera);
    const hitPoint = raycaster.ray.intersectSphere(sphereBoundary, sphereIntersectionPoint);
    if (hitPoint === null) {
      sourceCoordinateLabel.textContent = "Hover to read source pixel";
      return;
    }
    const sourceCoordinate = computeSourceCoordinate(hitPoint);
    sourceCoordinateLabel.textContent =
      sourceCoordinate === null
        ? "Outside the source image"
        : `Source pixel: (${Math.round(sourceCoordinate.x)}, ${Math.round(sourceCoordinate.y)})`;
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  let longitudeDegree = 0;
  let latitudeDegree = 0;
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let dragStartLongitudeDegree = 0;
  let dragStartLatitudeDegree = 0;

  function onPointerDown(event) {
    isDragging = true;
    dragStartX = event.clientX;
    dragStartY = event.clientY;
    dragStartLongitudeDegree = longitudeDegree;
    dragStartLatitudeDegree = latitudeDegree;
    renderer.domElement.setPointerCapture(event.pointerId);
    renderer.domElement.style.cursor = "grabbing";
  }

  function onPointerMove(event) {
    if (isDragging) {
      longitudeDegree = (dragStartX - event.clientX) * 0.1 + dragStartLongitudeDegree;
      latitudeDegree = (event.clientY - dragStartY) * 0.1 + dragStartLatitudeDegree;
    }
    updateSourceCoordinateLabel(event);
  }

  function onPointerUp() {
    isDragging = false;
    renderer.domElement.style.cursor = "crosshair";
  }

  function onPointerLeave() {
    sourceCoordinateLabel.textContent = "Hover to read source pixel";
  }

  function onWheel(event) {
    event.preventDefault();
    const nextFov = camera.fov + event.deltaY * 0.02;
    camera.fov = Math.min(100, Math.max(20, nextFov));
    camera.updateProjectionMatrix();
  }

  renderer.domElement.addEventListener("pointerdown", onPointerDown);
  renderer.domElement.addEventListener("pointermove", onPointerMove);
  renderer.domElement.addEventListener("pointerup", onPointerUp);
  renderer.domElement.addEventListener("pointercancel", onPointerUp);
  renderer.domElement.addEventListener("pointerleave", onPointerLeave);
  renderer.domElement.addEventListener("wheel", onWheel, { passive: false });

  new ResizeObserver(function () {
    if (container.clientWidth === 0 || container.clientHeight === 0) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }).observe(container);

  new ResizeObserver(function () {
    setFrameHeight(wrapper.scrollHeight);
  }).observe(wrapper);

  downloadButton.addEventListener("click", function () {
    renderer.render(scene, camera);
    const link = document.createElement("a");
    link.download = "sphere_view.png";
    link.href = renderer.domElement.toDataURL("image/png");
    link.click();
  });

  captureButton.addEventListener("click", function () {
    const clampedPitchDegree = Math.max(-85, Math.min(85, latitudeDegree));
    setComponentValue({
      yaw_deg: longitudeDegree,
      pitch_deg: clampedPitchDegree,
      fov_deg: camera.fov,
    });
    captureFeedbackLabel.textContent =
      `Extracted: yaw ${longitudeDegree.toFixed(1)}°, `
      + `pitch ${clampedPitchDegree.toFixed(1)}°, FoV ${camera.fov.toFixed(1)}°`;
  });

  function animate() {
    requestAnimationFrame(animate);
    latitudeDegree = Math.max(-85, Math.min(85, latitudeDegree));
    const phi = THREE.MathUtils.degToRad(90 - latitudeDegree);
    const theta = THREE.MathUtils.degToRad(longitudeDegree);
    const forwardDirection = new THREE.Vector3(
      Math.sin(phi) * Math.cos(theta),
      Math.cos(phi),
      Math.sin(phi) * Math.sin(theta)
    );
    const rollRadian = THREE.MathUtils.degToRad(currentArgs ? currentArgs.roll_degree : 0);
    camera.up.set(0, 1, 0).applyAxisAngle(forwardDirection, rollRadian);
    camera.lookAt(forwardDirection.clone().multiplyScalar(500));
    renderer.render(scene, camera);
  }
  animate();

  function onRender(event) {
    currentArgs = event.data.args;
    toolbar.style.maxWidth = currentArgs.max_width_px + "px";
    container.style.maxWidth = currentArgs.max_width_px + "px";
    container.style.aspectRatio = currentArgs.aspect_ratio;

    if (currentArgs.texture_base64 !== lastTextureBase64) {
      lastTextureBase64 = currentArgs.texture_base64;
      material.map = new THREE.TextureLoader().load(
        "data:image/jpeg;base64," + currentArgs.texture_base64
      );
      material.needsUpdate = true;
    }

    if (!isSceneInitialized && container.clientWidth > 0 && container.clientHeight > 0) {
      isSceneInitialized = true;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    setFrameHeight(wrapper.scrollHeight);
  }

  window.addEventListener("message", function (event) {
    if (event.data.type === "streamlit:render") {
      onRender(event);
    }
  });

  notifyComponentReady();
  setFrameHeight(wrapper.scrollHeight);
})();
</script>
</body>
</html>
